[project]
site_url = "https://pivot-point-labs.github.io/wiki/"
site_name = "PPL Wiki"
site_description = "Pivot Point Labs Wiki. Focusing on performance optimizations, ideas, scripts & anything else Assetto Corsa related."
# site_author = "Your name"

copyright = "Copyright &copy; 2026 Pivot Point Labs"

repo_url = "https://github.com/Pivot-Point-Labs/wiki"
# repo_name = "user/repo"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },

  { "Wiki" = [

    { "Optimizations" = [
      "optimizations/drawcalls.md",
      "optimizations/culling.md",
      "optimizations/lods.md",
      "optimizations/materials.md",
      "optimizations/textures.md",
      "optimizations/extconf.md",
    ]},

#    { "Tutorials" = [
#        "tutorials/combining-meshes.md",
#        "tutorials/merging-materials.md",
#        "tutorials/texture-creation-modification.md",
#    ]},

  ]},

  { "Other" = [
    "kn5-fileformat.md",
  ] },

  { "External" = [
    { "CSP Wiki (mirror)" = "https://pivot-point-labs.github.io/csp-wiki-mirror/" },
    { "RTB Discord" = "https://discord.gg/kAy8TmcEB" },
  ] },

  
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  # "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "header.autohide",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = "⚓︎"
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.blocks.caption = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}


[[project.markdown_extensions.zensical.extensions.preview.configurations]]
targets.include = [
  "*",
]

[project.plugins.autorefs]
link_titles = true

[project.plugins.callouts]

[project.plugins.glightbox]

[project.plugins.search]

[project.plugins.minify]

[project.extra]
generator = false